# ApexScout AI - Model Training & Pipeline Configuration
pipeline:
  name: "ApexScout Ensemble Multi-Sport Classifier"
  version: "3.2.0"
  framework: "scikit-learn"

reproducibility:
  seed: 42
  deterministic: true

data:
  dataset_dir: "dataset"
  target_size: [48, 48]
  test_split: 0.20
  stratify: true
  categories:
    - "Athletics"
    - "Basketball"
    - "Cricket"
    - "Kabaddi"
    - "Soccer"
    - "Volleyball"

model:
  type: "VotingClassifier"
  voting: "soft"
  random_forest:
    n_estimators: 100
    max_depth: 10
    n_jobs: 1
  extra_trees:
    n_estimators: 100
    max_depth: 10
    n_jobs: 1

feature_extraction:
  color_moments: true
  spatial_luminance_grid: 3
  sobel_gradients: true
  orientation_bins: 8
  symmetry_indices: true
  energy_percentiles: true

evaluation:
  save_confusion_matrix: true
  save_summary_json: true
  results_dir: "results"
  output_model_dir: "trained_model"
